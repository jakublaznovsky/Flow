# Builds the Windows installer and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0 (or run manually from the Actions tab).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Flow v__VERSION__'
          releaseBody: |
            Windows installer for Flow. Download `Flow_<version>_x64-setup.exe` below and run it.
            The installer is not code-signed: if Windows SmartScreen says "Windows protected your PC",
            click **More info → Run anyway**. Your data stays in the Flow folder you choose.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
